<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Приёмная № 07</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152b24;color:#f0e7d3;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none}
    canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;background:#152b24;gap:18px}
    h1{font-size:clamp(24px,5vw,38px);margin:0}.track{width:min(280px,75vw);height:4px;background:#36594b}.bar{height:100%;width:0;background:#bda574}#status{font-size:15px;max-width:340px;color:#c4c6ae}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>
  <div id="loading" role="status">
    <h1>Приёмная № 07</h1>
    <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <div id="status">Открываем приёмную…</div>
  </div>
  <script src="vk-bridge.min.js"></script>
  <script src="lombard-vk.js"></script>
  <script src="Build/b23dd96997961653e2825455633aac82.loader.js" onerror="document.getElementById('status').textContent='Не удалось загрузить игру. Обновите страницу.'"></script>
  <script>
    if (typeof createUnityInstance === 'function') {
      createUnityInstance(document.getElementById('unity-canvas'), {
        dataUrl: 'Build/d56cbe000ac9f66c2e52a42280d710bb.data.unityweb',
        frameworkUrl: 'Build/c308493d954ebdb46c59540535370a09.framework.js.unityweb',
        codeUrl: 'Build/c941e1537db02c28c288984c36b486ca.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Lombard",
        productName: "Lombard Reimagined",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
      }, progress => {
        document.getElementById('bar').style.width = (progress * 100) + '%';
      }).then(instance => {
        window.unityInstance = instance;
        document.getElementById('loading').remove();
      }).catch(error => {
        console.error(error);
        document.getElementById('status').textContent = 'Не удалось запустить игру. Обновите страницу.';
      });
    }
  </script>
</body>
</html>
